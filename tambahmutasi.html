<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Mutasi Warga</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">Sistem Informasi Kependudukan</div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Dashboard</a></li>
            <li><a href="penduduk.html" class="nav-link active">Data Penduduk</a></li>
            <li><a href="kk.html" class="nav-link">Kartu Keluarga</a></li>
            <li><a href="surat.html" class="nav-link">Layanan Surat</a></li>
            <li><a href="mutasi.html" class="nav-link">Mutasi Warga</a></li>
            <li><a href="laporan.html" class="nav-link">Laporan & Statistik</a></li>
            <li><a href="pengaturan.html" class="nav-link">Pengaturan</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="header">
            <div>
                <h1 class="page-title">Tambah Mutasi Warga</h1>
                <p class="subtitle">Catat Perubahan Status Warga</p>
            </div>
        </header>

        <div class="card">
            <div class="card-header">
                <h3>Tambah Mutasi Warga</h3>
                <a href="mutasi.html" class="btn">Kembali</a>
            </div>
            <form>
                <div class="form-group">
                    <label for="tanggal">Tanggal:</label>
                    <input type="date" id="tanggal" name="tanggal" required>
                </div>
                <div class="form-group">
                    <label for="nik">NIK Warga:</label>
                    <input type="text" id="nik" name="nik" required>
                </div>
                <div class="form-group">
                    <label for="jenis_mutasi">Jenis Mutasi:</label>
                    <select id="jenis_mutasi" name="jenis_mutasi" required>
                        <option value="">Pilih Jenis Mutasi</option>
                        <option value="masuk">Masuk</option>
                        <option value="pindah">Pindah</option>
                        <option value="kematian">Kematian</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="keterangan">Keterangan:</label>
                    <textarea id="keterangan" name="keterangan" required></textarea>
                </div>
                <input type="submit" value="Simpan" class="btn">
                <input type="reset" value="Batal" class="btn">
            </form>
        </div>
    </main>
</body>
</html>
